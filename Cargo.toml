[package]
name = "rust-trafilatura"
version = "2.2.3"
edition = "2021"
rust-version = "1.98.1"
description = "Native Rust port of Go-Trafilatura's HTML extraction pipeline"
repository = "https://github.com/markusmobius/rust-trafilatura"
license = "Apache-2.0 AND BSD-3-Clause"
publish = false

[features]
default = ["mimalloc"]
mimalloc = ["dep:mimalloc"]

[profile.release]
lto = "thin"

[dependencies]
chrono = { version = "0.4.42", default-features = false, features = ["clock", "std"] }
encoding_rs = "0.8.35"
flate2 = "1"
markup5ever = "=0.39.0"
mimalloc = { version = "=0.1.48", default-features = false, optional = true }
regex = "1.13.1"
rust-domdistiller = { version = "=1.0.1", git = "https://github.com/markusmobius/rust-domdistiller", tag = "v1.0.1" }
rust-htmldate = { version = "=1.10.2", git = "https://github.com/markusmobius/rust-htmldate", tag = "v1.10.2" }
rust-py3langid = "=0.4.0"
rust-readability-v2 = { version = "=0.6.2", git = "https://github.com/markusmobius/rust-readability", tag = "v0.6.2" }
serde = { version = "1", features = ["derive"] }
serde_json = { version = "1", features = ["raw_value", "unbounded_depth"] }
serde_stacker = "=0.1.14"
unicode-normalization = "0.1"
